---
- name: Configure and Deploy Docker Application
  hosts: webserver
  become: true

  tasks:

    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull application image
      community.docker.docker_image:
        name: "bsudarshan7/ansible-cicd-demo:v3"
        source: pull

    - name: Run application container
      community.docker.docker_container:
        name: ansible-demo-auto
        image: "bsudarshan7/ansible-cicd-demo:v3"
        state: started
        restart_policy: unless-stopped
        ports:
          - "8080:80"
