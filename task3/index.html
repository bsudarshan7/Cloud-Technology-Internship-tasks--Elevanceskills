
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Compose Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #17243a;
        }

        main {
            padding: 70px 20px;
        }

        h1 {
            color: #61dafb;
            font-size: 36px;
        }

        .card {
            max-width: 650px;
            margin: 25px auto;
            padding: 30px;
            border-radius: 12px;
            background: #1e2d45;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            background: #087ea4;
            color: white;
            cursor: pointer;
        }

        footer {
            padding: 20px;
            color: #aab6c8;
        }
    </style>
</head>

<body>

<header>
    <h2>Docker Compose Deployment</h2>
</header>

<main>
    <h1>Welcome to My DevOps Project</h1>

    <div class="card">
        <h2>Nginx Container Running</h2>

        <p>
            This static website is deployed using Docker Compose.
        </p>

        <p id="status">Application is running successfully.</p>

        <button onclick="checkStatus()">
            Check Application
        </button>
    </div>
</main>

<footer>
    Task 3 | Docker Compose | Nginx
</footer>

<script>
    function checkStatus() {
        document.getElementById("status").innerText =
            "Application is working successfully!";
    }
</script>

</body>
</html>
