<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenkins CI/CD Deployment</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    main {
      max-width: 700px;
      margin: 20px;
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      color: #16a34a;
    }

    p {
      margin: 0;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jenkins CI/CD Pipeline Deployed Successfully!</h1>
    <p>The application was built and deployed automatically.</p>
  </main>
</body>
</html>
